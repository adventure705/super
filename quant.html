<!DOCTYPE html>
<html lang="ko">
<head>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>퀀트 매수·매도 수량 계산기</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #f4f7f9;
  font-family: 'Inter', sans-serif;
  color: #1f2937;
}
.container {
  width: min(1180px, 100%);
  margin: 0 auto;
  padding: 8px;
}
.top {
  position: sticky;
  top: 0;
  z-index: 10;
  background: rgba(244,247,249,.96);
  padding-bottom: 8px;
}
h1 {
  margin: 6px 0 10px;
  text-align: center;
  font-size: clamp(22px, 4vw, 34px);
}
.tabs {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
  padding: 6px;
  background: white;
  border-radius: 14px;
  box-shadow: 0 4px 15px rgba(0,0,0,.1);
}
.tabs button {
  min-height: 48px;
  border: 0;
  border-radius: 10px;
  font-size: 17px;
  font-weight: 800;
  cursor: pointer;
}
.tabs .buy.active { background: #4338ca; color: white; }
.tabs .sell.active { background: #be123c; color: white; }
.tabs button:not(.active) { background: #eef2f7; color: #4b5563; }

.common {
  background: white;
  border: 3px solid #818cf8;
  border-radius: 12px;
  padding: 10px;
  margin: 10px 0 8px;
  box-shadow: 0 5px 14px rgba(0,0,0,.08);
}
.sell-common { border-color: #fb7185; }
.common-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
label {
  display: block;
  font-size: 12px;
  font-weight: 700;
  margin: 3px 0;
}
input {
  width: 100%;
  min-height: 42px;
  border: 1px solid #cbd5e1;
  border-radius: 7px;
  padding: 7px;
  font-size: 16px;
  text-align: right;
  background: white;
}
.input-wrap { position: relative; }
.input-wrap input { padding-right: 22px; }
.input-wrap span {
  position: absolute;
  right: 7px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 12px;
  color: #6b7280;
}
.cards {
  display: grid;
  grid-template-columns: repeat(3, minmax(0,1fr));
  gap: 6px;
}
.card {
  min-width: 0;
  background: white;
  border-radius: 10px;
  padding: 7px;
  box-shadow: 0 5px 14px rgba(0,0,0,.09);
}
.buy-card { border: 2px solid #818cf8; }
.sell-card { border: 2px solid #fb7185; }
.card h2 {
  margin: 0 0 6px;
  padding-bottom: 5px;
  border-bottom: 1px solid #e5e7eb;
  text-align: center;
  font-size: 14px;
}
.amount-box {
  margin: 6px 0;
  padding: 6px;
  background: #f8fafc;
  border: 1px solid #e5e7eb;
  border-radius: 7px;
  text-align: center;
}
.amount-box small, .result small {
  display: block;
  font-size: 9px;
  line-height: 1.15;
}
.amount-box strong {
  display: block;
  color: #1d4ed8;
  font-size: 14px;
  overflow-wrap: anywhere;
}
.result {
  margin-top: 7px;
  padding: 6px;
  border-radius: 8px;
  display: grid;
  grid-template-columns: 1fr;
  gap: 4px;
  color: white;
}
.buy-result { background: #4338ca; }
.sell-result { background: #be123c; }
.result div {
  min-width:0;padding:5px 2px;border-radius:6px;text-align:center;background:rgba(255,255,255,.14);
}
.result div:last-child{background:#facc15;border:2px solid #f59e0b;box-shadow:0 0 12px rgba(250,204,21,.7);transform:scale(1.03);}
.buy-result div:last-child strong{color:#b91c1c;font-size:20px;font-weight:900;}
.sell-result div:last-child strong{color:#991b1b;font-size:20px;font-weight:900;}
.result div:last-child small{color:#7c2d12;font-weight:800;font-size:11px;}
.result strong {display:block;margin-top:2px;font-size:14px;overflow-wrap:anywhere;font-weight:800;}
.error {
  min-height: 12px;
  margin: 4px 0 0;
  color: #dc2626;
  font-size: 9px;
  text-align: center;
}
.formula {
  margin: 7px 0 0;
  font-size: 11px;
  color: #6b7280;
  text-align: center;
}
.hidden { display: none !important; }

@media (min-width: 640px) {
  .container { padding: 14px; }
  .cards { gap: 14px; }
  .card { padding: 14px; border-width: 4px; }
  .card h2 { font-size: 20px; }
  label { font-size: 14px; }
  input { min-height: 48px; font-size: 17px; padding: 10px; }
  .result { grid-template-columns: 1fr 1fr; padding: 10px; }
  .result small { font-size: 11px; }
  .result strong { font-size: 20px; }
  .buy-result div:last-child strong,.sell-result div:last-child strong{font-size:28px;}
  .amount-box strong { font-size: 20px; }
}

@media (max-width: 390px) {
  .container { padding: 4px; }
  .cards { gap: 3px; }
  .card { padding: 4px; }
  .card h2 { font-size: 11px; }
  label { font-size: 9px; }
  input { min-height: 36px; padding: 4px; font-size: 12px; }
  .result strong, .amount-box strong { font-size: 11px; }
}
</style>
</head>
<body>
<div class="container">
  <div class="top">
    <h1>퀀트 수량 계산기</h1>
    <div class="tabs">
      <button id="buyTab" class="buy active" onclick="showTab('buy')">📈 매수</button>
      <button id="sellTab" class="sell" onclick="showTab('sell')">📉 매도</button>
    </div>
  </div>

  <section id="buySection">
    <div class="common">
      <label for="totalAmount">💰 총 금액 (USD)</label>
      <input id="totalAmount" inputmode="decimal" placeholder="총 금액" oninput="calculateAllBuy()">
    </div>
    <div class="cards">
      
    <article class="card buy-card">
      <h2>매수 1</h2>
      <label>매수 비율 (%)</label>
      <div class="input-wrap">
        <input id="percentage1" inputmode="decimal" oninput="calculateBuy(1)">
        <span>%</span>
      </div>
      <div class="amount-box">
        <small>비율 금액</small>
        <strong id="adjustedAmountDisplay1">0.00</strong>
      </div>
      <label>단위 가격</label>
      <input id="unitPrice1" inputmode="decimal" oninput="calculateBuy(1)">
      <div class="result buy-result">
        <div><small>소수점 2자리</small><strong id="quantityDecimal1">0.00</strong></div>
        <div><small>반올림 정수</small><strong id="quantityInteger1">0</strong></div>
      </div>
      <p id="buyError1" class="error"></p>
    </article>
    
    <article class="card buy-card">
      <h2>매수 2</h2>
      <label>매수 비율 (%)</label>
      <div class="input-wrap">
        <input id="percentage2" inputmode="decimal" oninput="calculateBuy(2)">
        <span>%</span>
      </div>
      <div class="amount-box">
        <small>비율 금액</small>
        <strong id="adjustedAmountDisplay2">0.00</strong>
      </div>
      <label>단위 가격</label>
      <input id="unitPrice2" inputmode="decimal" oninput="calculateBuy(2)">
      <div class="result buy-result">
        <div><small>소수점 2자리</small><strong id="quantityDecimal2">0.00</strong></div>
        <div><small>반올림 정수</small><strong id="quantityInteger2">0</strong></div>
      </div>
      <p id="buyError2" class="error"></p>
    </article>
    
    <article class="card buy-card">
      <h2>매수 3</h2>
      <label>매수 비율 (%)</label>
      <div class="input-wrap">
        <input id="percentage3" inputmode="decimal" oninput="calculateBuy(3)">
        <span>%</span>
      </div>
      <div class="amount-box">
        <small>비율 금액</small>
        <strong id="adjustedAmountDisplay3">0.00</strong>
      </div>
      <label>단위 가격</label>
      <input id="unitPrice3" inputmode="decimal" oninput="calculateBuy(3)">
      <div class="result buy-result">
        <div><small>소수점 2자리</small><strong id="quantityDecimal3">0.00</strong></div>
        <div><small>반올림 정수</small><strong id="quantityInteger3">0</strong></div>
      </div>
      <p id="buyError3" class="error"></p>
    </article>
    
    </div>
  </section>

  <section id="sellSection" class="hidden">
    <div class="common sell-common">
      <div class="common-grid">
        <div>
          <label for="totalBuyQuantity">📦 총 매수수량</label>
          <input id="totalBuyQuantity" inputmode="decimal" placeholder="수량" oninput="calculateAllSell()">
        </div>
        <div>
          <label for="totalBuyPercentage">📊 총 매수 비율 (%)</label>
          <input id="totalBuyPercentage" inputmode="decimal" placeholder="비율" oninput="calculateAllSell()">
        </div>
      </div>
      <p class="formula">총 매수수량 × 매도 비율 ÷ 총 매수 비율</p>
    </div>
    <div class="cards">
      
    <article class="card sell-card">
      <h2>매도 1</h2>
      <label>매도 비율 (%)</label>
      <div class="input-wrap">
        <input id="sellPercentage1" inputmode="decimal" oninput="calculateSell(1)">
        <span>%</span>
      </div>
      <div class="result sell-result">
        <div><small>소수점 2자리</small><strong id="sellQuantityDecimal1">0.00</strong></div>
        <div><small>반올림 정수</small><strong id="sellQuantityInteger1">0</strong></div>
      </div>
      <p id="sellError1" class="error"></p>
    </article>
    
    <article class="card sell-card">
      <h2>매도 2</h2>
      <label>매도 비율 (%)</label>
      <div class="input-wrap">
        <input id="sellPercentage2" inputmode="decimal" oninput="calculateSell(2)">
        <span>%</span>
      </div>
      <div class="result sell-result">
        <div><small>소수점 2자리</small><strong id="sellQuantityDecimal2">0.00</strong></div>
        <div><small>반올림 정수</small><strong id="sellQuantityInteger2">0</strong></div>
      </div>
      <p id="sellError2" class="error"></p>
    </article>
    
    <article class="card sell-card">
      <h2>매도 3</h2>
      <label>매도 비율 (%)</label>
      <div class="input-wrap">
        <input id="sellPercentage3" inputmode="decimal" oninput="calculateSell(3)">
        <span>%</span>
      </div>
      <div class="result sell-result">
        <div><small>소수점 2자리</small><strong id="sellQuantityDecimal3">0.00</strong></div>
        <div><small>반올림 정수</small><strong id="sellQuantityInteger3">0</strong></div>
      </div>
      <p id="sellError3" class="error"></p>
    </article>
    
    </div>
  </section>
</div>

<script>
function n(v) {
  return parseFloat(String(v).replace(/,/g, ""));
}
function fmt2(v) {
  return v.toLocaleString("ko-KR", {minimumFractionDigits:2, maximumFractionDigits:2});
}
function showTab(tab) {
  const buy = tab === "buy";
  document.getElementById("buySection").classList.toggle("hidden", !buy);
  document.getElementById("sellSection").classList.toggle("hidden", buy);
  document.getElementById("buyTab").classList.toggle("active", buy);
  document.getElementById("sellTab").classList.toggle("active", !buy);
}
function calculateAllBuy() {
  for (let i=1; i<=3; i++) calculateBuy(i);
}
function calculateBuy(i) {
  const totalRaw = document.getElementById("totalAmount").value.trim();
  const pctRaw = document.getElementById("percentage"+i).value.trim();
  const priceRaw = document.getElementById("unitPrice"+i).value.trim();
  const total = n(totalRaw), pct = n(pctRaw), price = n(priceRaw);
  const amount = document.getElementById("adjustedAmountDisplay"+i);
  const decimal = document.getElementById("quantityDecimal"+i);
  const integer = document.getElementById("quantityInteger"+i);
  const error = document.getElementById("buyError"+i);
  error.textContent = "";
  if (totalRaw !== "" && pctRaw !== "" && !isNaN(total) && !isNaN(pct) && total >= 0 && pct >= 0) {
    const adjusted = total * pct / 100;
    amount.textContent = fmt2(adjusted);
    if (priceRaw !== "" && !isNaN(price) && price > 0) {
      const qty = adjusted / price;
      decimal.textContent = fmt2(qty);
      integer.textContent = Math.round(qty).toLocaleString("ko-KR");
    } else {
      decimal.textContent = "0.00";
      integer.textContent = "0";
      if (priceRaw !== "" && price <= 0) error.textContent = "가격은 0보다 커야 합니다.";
    }
  } else {
    amount.textContent = "0.00";
    decimal.textContent = "0.00";
    integer.textContent = "0";
  }
}
function calculateAllSell() {
  for (let i=1; i<=3; i++) calculateSell(i);
}
function calculateSell(i) {
  const qtyRaw = document.getElementById("totalBuyQuantity").value.trim();
  const totalPctRaw = document.getElementById("totalBuyPercentage").value.trim();
  const sellPctRaw = document.getElementById("sellPercentage"+i).value.trim();
  const qty = n(qtyRaw), totalPct = n(totalPctRaw), sellPct = n(sellPctRaw);
  const decimal = document.getElementById("sellQuantityDecimal"+i);
  const integer = document.getElementById("sellQuantityInteger"+i);
  const error = document.getElementById("sellError"+i);
  error.textContent = "";
  if (qtyRaw !== "" && totalPctRaw !== "" && sellPctRaw !== "" &&
      !isNaN(qty) && !isNaN(totalPct) && !isNaN(sellPct) &&
      qty >= 0 && totalPct > 0 && sellPct >= 0) {
    const result = qty * sellPct / totalPct;
    decimal.textContent = fmt2(result);
    integer.textContent = Math.round(result).toLocaleString("ko-KR");
  } else {
    decimal.textContent = "0.00";
    integer.textContent = "0";
    if (totalPctRaw !== "" && totalPct <= 0) error.textContent = "총 매수 비율은 0보다 커야 합니다.";
  }
}
</script>
</body>
</html>
